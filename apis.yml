name: FreightRoll
description: >-
  FreightRoll is a logistics technology company whose flagship product, YardOS, is a
  customizable Yard Operating / Management System (YMS) that turns shipping and receiving
  yards into driver-friendly, self-service hubs. YardOS reduces truck-driver wait times,
  improves yard throughput, and streamlines gate and dock operations, with the company
  citing up to a 50% reduction in truck turnaround time, 95%+ fewer human-to-driver
  interactions, and $100K+ annual savings per facility across a network of 150,000+
  registered drivers. FreightRoll integrates with existing systems across API, EDI, and
  SFTP mechanisms and deploys remotely in under an hour. The company is backed by 500
  Global. FreightRoll does not currently publish a public developer portal, API reference,
  or OpenAPI definition; its public website is Wix-hosted and exposes a Wix Site MCP
  endpoint for agentic AI access to public site content.
