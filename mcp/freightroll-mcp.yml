generated: '2026-07-19'
method: searched
source: https://www.freightroll.com/llms.txt
status: published
notes: >-
  FreightRoll's public website is built on Wix, which exposes a Wix Site MCP
  endpoint for agentic access. This is a Wix-provided site MCP (site content +
  Wix business-solutions APIs), not a bespoke YardOS product MCP. No
  authentication is required; only public site information is accessible.
server:
  name: freightroll-site
  vendor: Wix Site MCP
  transport: http
  url: https://www.freightroll.com/_api/mcp
  auth: none
  docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
  - name: GetBusinessDetails
    description: Retrieves business and site details such as timezone, email, phone, and address.
  - name: SearchInSite
    description: Searches the site for information.
  - name: SearchSiteApiDocs
    description: >-
      Retrieves the API documentation for the Wix business solutions installed on
      this site and informs the AI client how to use the APIs.
  - name: GenerateVisitorToken
    description: >-
      Creates a new visitor session and obtains a visitor access token for the site.
      Must be called before making any CallWixSiteAPI request.
  - name: CallWixSiteAPI
    description: >-
      Calls API methods on the site to perform actions on a visitor's behalf, such as
      querying site data, booking an appointment, or starting a purchase.
  - name: ReadFullDocsArticle
    description: Fetches a complete article from the Wix developer documentation portal.
  - name: ReadFullDocsMethodSchema
    description: Fetches the full schema for a Wix API method.
